name: Canvas validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Canvas / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/astro/package-lock.json
            examples/react/package-lock.json
            examples/vue/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Validate runtime contracts, public types and installed archive
        run: npm run check
      - name: Build isolated Astro consumer from packed archive
        run: npm run test:astro
      - name: Build isolated React and Vue consumers from packed archive
        run: npm run test:frameworks
      - name: Verify generated HTML, Astro, React and Vue examples
        run: npm run test:configurator
      - name: Verify checks leave tracked files unchanged
        run: git diff --exit-code
